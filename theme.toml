# generated by ChatGPT
# =========================================
# Sphinx Awesome Theme configuration
# =========================================

[theme]
name = "awesome"
description = "Clean, modern theme for technical documentation"
version = "1.0.0"

# -----------------------------------------
# Branding
# -----------------------------------------

[branding]
site_name = "Haskell Optimization Handbook"
site_logo = ""
site_favicon = ""

# -----------------------------------------
# Layout options
# -----------------------------------------

[layout]
# Show table of contents on the right
toc = true

# Maximum content width (px)
max_width = 1200

# Sticky sidebar
sidebar_sticky = true

# -----------------------------------------
# Navigation
# -----------------------------------------

[navigation]
# Show next / previous buttons
show_prev_next = true

# Collapse navigation tree
collapse_navigation = true

# Maximum depth for sidebar TOC
navigation_depth = 4

# -----------------------------------------
# Code blocks
# -----------------------------------------

[code]
# Enable copy button (works with sphinx-copybutton)
copy_button = true

# Show line numbers in code blocks
line_numbers = false

# -----------------------------------------
# Typography
# -----------------------------------------

[fonts]
body = "Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
mono = "JetBrains Mono, Fira Code, monospace"

font_size = "16px"
line_height = 1.6

# -----------------------------------------
# Colors
# -----------------------------------------

[colors]
primary = "#3b82f6"
secondary = "#64748b"
background = "#ffffff"
surface = "#f8fafc"
text = "#0f172a"

# -----------------------------------------
# Admonitions
# -----------------------------------------

[admonitions]
style = "modern"

# -----------------------------------------
# Footer
# -----------------------------------------

[footer]
copyright = "© 2026 Haskell Optimization Handbook contributors"
show_sphinx = false
show_theme = false

# -----------------------------------------
# Extra CSS / JS
# -----------------------------------------

[extra]
css = []
js = []
